name: Build Release

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    paths:
      - "source/**"
  push:
    paths:
      - "source/**"

jobs:
  check_localization:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check localization keys
        run: python scripts/check_localization.py

  build-altair:
    needs: check_localization
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build "source/AnimusReforged.Altair/AnimusReforged.Altair.csproj" -c Release

      - name: Run unit tests
        run: dotnet test "tests/AnimusReforged.Tests/AnimusReforged.Tests.csproj" -c Release --verbosity normal

      - name: Publish
        run: >
          dotnet publish "source/AnimusReforged.Altair/AnimusReforged.Altair.csproj"
          -c Release
          -r win-x64
          --self-contained false
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Altair
          path: ./publish/
          if-no-files-found: error
